<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="canonical" href="https://www.juned-setiawan.my.id/" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/logo.png" />
		<meta name="google-site-verification" content="Ip2BpSTQH-80yNK8azKAwFke2OwKFl4Ln8Fk6rJymtY" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply theme before first paint to avoid a flash, and flag JS for reveal animations.
			(function () {
				var root = document.documentElement;
				root.classList.add('js');
				var stored = null;
				try {
					stored = localStorage.getItem('theme');
				} catch (e) {}
				var dark = stored
					? stored === 'dark'
					: !window.matchMedia('(prefers-color-scheme: light)').matches;
				root.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
